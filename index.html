<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物理治療學員學習歷程平台</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1f2933;--ink2:#4a5562;--muted:#6b7684;--line:#e3e7ec;--grid:#eef1f4;
  --green:#2e7d4f;--green-bg:#e3f3e9;--yellow:#9a5f0c;--yellow-bg:#fdf1dc;--yellow-mark:#d9a03f;
  --red:#b83227;--red-bg:#fbe4e1;--accent:#2f5d8a;--accent-bg:#e6eef7;--pre:#9aa5b1;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181d;--card:#1d232a;--ink:#e6e9ed;--ink2:#c3cad3;--muted:#97a1ad;--line:#2e3640;--grid:#262d35;
  --green:#6fcf97;--green-bg:#1c3326;--yellow:#f2c46d;--yellow-bg:#3a2f18;--yellow-mark:#e0b050;
  --red:#ff8a7a;--red-bg:#3d1f1c;--accent:#8cb8e6;--accent-bg:#1f2e3d;--pre:#6b7684;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
.sub{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.cohort{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card>h2{font-size:15px;margin:0 0 12px}
.card>h2 small{font-weight:normal;color:var(--muted);font-size:12px;margin-left:6px}
h3{font-size:14px;margin:0 0 8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.l,th.l{text-align:left}
.scroll{overflow-x:auto}
.ov th.so{cursor:pointer;user-select:none}.ov th.so:hover{color:var(--accent)}
.ov th .ar{display:inline-block;width:10px;color:var(--accent)}
.ov tbody tr{cursor:pointer}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;margin:1px 2px 1px 0;background:var(--red-bg);color:var(--red);white-space:nowrap}
.chip.y{background:var(--yellow-bg);color:var(--yellow)}
.fails{max-width:280px;text-align:left}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--accent)}.ov tbody tr:hover{background:var(--accent-bg)}
.cell{display:inline-block;min-width:52px;padding:2px 6px;border-radius:6px;font-weight:600;white-space:nowrap}
.g{background:var(--green-bg);color:var(--green)}.y{background:var(--yellow-bg);color:var(--yellow)}.r{background:var(--red-bg);color:var(--red)}
.n{color:var(--muted)}
.mini{display:block;font-size:11px;font-weight:normal}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.stuhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stuhead h2{margin:0;font-size:20px}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
@media(max-width:520px){.grid.wide{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.box h3{display:flex;justify-content:space-between;align-items:center}
.tch td{padding:6px 6px}
.tm{display:inline-block;min-width:40px;padding:1px 6px;border-radius:5px;font-weight:600}
.tm.hi{background:var(--accent-bg);color:var(--accent)}
.tm.lo{background:#fdebd8;color:#a3520b}
@media (prefers-color-scheme:dark){.tm.lo{background:#3d2a17;color:#f0b37a}}
.tn{display:block;font-size:10px;color:var(--muted)}
tr.avg td{font-weight:600;background:var(--bg)}
.chk{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,auto);column-gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border-bottom:none}
.chk .ic{font-weight:700}.chk .ok{color:var(--green)}.chk .no{color:var(--red)}
.chk .d{color:var(--muted);text-align:right;font-size:12px;max-width:170px;overflow-wrap:anywhere}
.chk .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk.bad .lb{color:var(--red);font-weight:600}
.epa-g{margin-top:8px;padding:6px 8px 2px;border-radius:6px;background:var(--bg)}
.epa-g .tt{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epa-g .chk{padding:3px 0;border-bottom:none}
.reasons{margin:6px 0 10px;padding-left:20px}.reasons li{margin:2px 0}
.bar{margin:7px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.track{position:relative;height:8px;background:var(--grid);border-radius:4px;margin-top:3px}
.fill{height:100%;border-radius:0 4px 4px 0}
.fill.g{background:var(--green)}.fill.y{background:var(--yellow-mark)}.fill.r{background:var(--red)}
.t60{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.4}
/* 前後測 dumbbell */
.db{display:grid;grid-template-columns:128px minmax(140px,1fr) 118px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.db .nm{color:var(--ink2)}
.db .sc{position:relative;height:24px}
.db .ax{position:absolute;left:0;right:0;top:11px;height:2px;background:var(--grid)}
.db .tk{position:absolute;top:4px;width:1px;height:16px;background:var(--ink);opacity:.35}
.db .tl{position:absolute;top:-12px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.db .seg{position:absolute;top:10px;height:4px;border-radius:2px}
.db .dot{position:absolute;top:5px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--card);cursor:default}
.db .dot.pre{background:var(--pre)}.db .dot.post{background:var(--accent)}
.db .dv{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:13px}
.sub-t td,.sub-t th{padding:4px 6px;font-size:12px}
/* EPA */
.epa td{font-size:12px;padding:5px 6px}
.epa td.l{max-width:320px;white-space:normal}
.lv{display:inline-block;min-width:34px;border-radius:5px;padding:1px 4px;font-weight:700}
.epa th.last,.epa td.last{background:var(--accent-bg)}
/* 回饋 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select.btn{padding:5px 8px}
.cm{border-bottom:1px solid var(--line);padding:8px 2px;display:flex;gap:12px}
.cm .meta{font-size:12px;color:var(--muted);min-width:160px;flex:none}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;margin-right:4px;background:var(--accent-bg);color:var(--accent)}
mark{border-radius:3px;padding:0 2px}
mark.w{background:var(--red-bg);color:var(--red);font-weight:600}
mark.s{background:var(--yellow-bg);color:var(--yellow)}
textarea{width:100%;min-height:70px;margin-top:10px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.dec label{margin-right:16px;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
@media(max-width:640px){header{padding:10px 16px}.db{grid-template-columns:96px 1fr 80px}.cm{flex-direction:column;gap:2px}}
@media print{header nav,.noprint{display:none}.card{break-inside:avoid}}
</style>
</head>

</header>

const stationsOf = r => ST_ORDER.filter(s => r.站別[s]);
const formsOf = (id,st,kind) => FORMS.filter(f => f.學員===id && (!st||f.站別===st) && (!kind||f.表單===kind));

/* ---------------- 總覽 ---------------- */
const COLS = [{k:'學員',t:'學員',l:1},{k:'骨科',t:'骨科'},{k:'神經',t:'神經'},{k:'第三站',t:'心肺／小兒'},{k:'EPA',t:'EPA 達標'},
  {k:'CT',t:'CT'},{k:'JM',t:'JM'},{k:'總成績',t:'總成績<br><span style="font-weight:normal">(參考)</span>'},{k:'判定',t:'系統判定',l:1},{k:'決議',t:'CCC 決議',l:1}];
function codeNum(id){ const m=String(id).match(/(\d+)-(\d+)/); return m ? (+m[1])*1000 + (+m[2]) : id }
function sortVal(r,k){
  const st = s => r.站別[s]?.站總分 ?? null;
  switch(k){
    case '學員': return codeNum(r.學員);
    case '骨科': case '神經': return st(k);
    case '第三站': return st('心肺') ?? st('小兒');
    case 'EPA': { const e=epaSummary(r); return e.all ? e.ok/e.all : null }
    case 'CT': return r.整體['CT（個案＋專題）'];
    case 'JM': return r.整體['JM（期刊）'];
    case '總成績': return r.整體['總成績（參考）'];
    case '判定': return {r:0,y:1,g:2}[stCls(r.狀態)];
    case '決議': return DEC[r.學員]?.d || null;
  }
}
function sortBy(k){ if (sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=1 } render() }
function epaOk(r, s, topic){
  const key = `EPA「${String(topic).slice(0,18)}」`;
  const cs = (r.站別[s]?.檢核||[]).filter(c=>c[0].startsWith(key));
  return cs.length>0 && cs.every(c=>c[1]);
}
function epaSummary(r){
  let ok=0, all=0;
  for (const s of stationsOf(r)) {
    const chk = r.站別[s].檢核.filter(c=>c[0].startsWith('EPA「'));
    const topics = [...new Set(chk.map(c=>c[0].split('」')[0]))];
    for (const t of topics) { all++; if (chk.filter(c=>c[0].startsWith(t)).every(c=>c[1])) ok++; }
  }
  return {ok, all};
}
const natKey = s => String(s).split(/(\d+)/).map(t=>/^\d+$/.test(t)?t.padStart(8,'0'):t).join('');
const STATUS_RANK = s => s.startsWith('未達') ? 0 : s.includes('討論') ? 1 : 2;
function shortChk(name){
  if (name.startsWith('EPA「')) {
    if (name.includes('位教師')) return 'EPA 教師數';
    if (name.includes('Level')) return 'EPA 等級';
    if (name.includes('份')) return 'EPA 份數';
    return 'EPA';
  }
  if (name.startsWith('自評表')) return '自評表缺';
  if (name.startsWith('自評後測')) return '自評未達 B';
  if (name.startsWith('站總分')) return '站總分';
  const m = name.match(/^(.+?)\s*≥\s*\d+\s*份/); if (m) return m[1] + ' 份數';
  return name;
}
function failList(r){
  const out = [];
  for (const s of stationsOf(r)) for (const c of r.站別[s].檢核) if (!c[1]) out.push({st:s, t:shortChk(c[0]), d:c[2]});
  const o = r.整體;
  for (const [k,v] of Object.entries(o.報告||{})) if (v==null || v<PASS) out.push({st:'學術', t:k.replace('報告','')+'報告', d:v==null?'無成績':fmt(v)});
  if (!o.跨團隊討論單) out.push({st:'學術', t:'跨團隊討論單', d:'缺'});
  for (const [s,w] of Object.entries(r.課程||{})) if (w.後測未過.length) out.push({st:s+'課程', t:'後測', d:w.後測未過.join('、')});
  return out;
}
function renderOv(){
  const cnt={g:0,y:0,r:0}; STU.forEach(r=>cnt[stCls(r.狀態)]++);
  const third = r => r.站別['心肺'] ? '心肺' : r.站別['小兒'] ? '小兒' : null;
  const COLS = [
    ['學員', r=>natKey(r.學員), 'l'],
    ['骨科', r=>r.站別['骨科']?.站總分 ?? -1],
    ['神經', r=>r.站別['神經']?.站總分 ?? -1],
    ['心肺／小兒', r=>{const t=third(r); return t? (r.站別[t].站總分??-1) : -1}],
    ['EPA 達標', r=>{const e=epaSummary(r); return e.all? e.ok/e.all : -1}],
    ['CT', r=>r.整體['CT（個案＋專題）'] ?? -1],
    ['JM', r=>r.整體['JM（期刊）'] ?? -1],
    ['總成績', r=>r.整體['總成績（參考）'] ?? -1],
    ['系統判定', r=>STATUS_RANK(r.狀態), 'l'],
    ['CCC 決議', r=>DEC[r.學員]?.d || '', 'l'],
  ];
  const col = COLS.find(c=>c[0]===sortKey) || COLS[0];
  const idx = STU.map((r,i)=>i).sort((a,b)=>{ const x=col[1](STU[a]), y=col[1](STU[b]);
    return (x<y?-1:x>y?1:natKey(STU[a].學員)<natKey(STU[b].學員)?-1:1) * (x===y?1:sortDir) });
  const arrow = k => k===sortKey ? (sortDir===1?' ▲':' ▼') : ' <span style="opacity:.35">⇅</span>';
  let h = `<div class="card"><h2>${DATA.梯次} 梯次總覽<small>點選欄位標題可遞增／遞減排序；點選任一列查看學員檔案</small></h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
   <span class="pill g">✓ 符合通過條件 ${cnt.g} 人</span><span class="pill y">△ 建議討論 ${cnt.y} 人</span><span class="pill r">✗ 未達條件 ${cnt.r} 人</span></div>
  <div class="scroll"><table class="ov"><thead><tr>${COLS.map(c=>`<th class="${c[2]||''} sortable" onclick="sortBy('${c[0]}')">${c[0]}${c[0]==='總成績'?'<span style="font-weight:normal">(參考)</span>':''}${arrow(c[0])}</th>`).join('')}</tr></thead><tbody>`;
  idx.forEach(i=>{ const r=STU[i];
    const cell = s => { const x=r.站別[s]; if(!x) return null;
      const fails = x.檢核.filter(c=>!c[1]).map(c=>shortChk(c[0]));
      const c = fails.length ? 'r' : cls(x.站總分);
      return `<span class="cell ${c}">${f1(x.站總分)}${fails.length?`<span class="mini">✗ ${[...new Set(fails)].join('、')}</span>`:''}</span>`; };
    const t = third(r), e = epaSummary(r), o=r.整體;
    h += `<tr onclick="openStu(${i})"><td class="l"><b>${esc(r.學員)}</b></td>
      <td>${cell('骨科')||'<span class="n">—</span>'}</td><td>${cell('神經')||'<span class="n">—</span>'}</td>
      <td>${t?`<span class="note">${t}</span> ${cell(t)}`:'<span class="cell r">缺</span>'}</td>
      <td><span class="cell ${e.ok===e.all&&e.all?'g':'r'}">${e.ok}/${e.all}</span></td>
      <td><span class="cell ${cls(o['CT（個案＋專題）'])}">${fmt(o['CT（個案＋專題）'])}</span></td>
      <td><span class="cell ${cls(o['JM（期刊）'])}">${fmt(o['JM（期刊）'])}</span></td>
      <td><b>${f1(o['總成績（參考）'])}</b></td>
      <td class="l"><span class="pill ${stCls(r.狀態)}">${r.狀態}</span></td>
      <td class="l">${DEC[r.學員]?.d?esc(DEC[r.學員].d):'<span class="n">未決議</span>'}</td></tr>`;
  });
  h += `</tbody></table></div>
  <div class="legend"><span><i style="background:var(--green)"></i>≥70</span><span><i style="background:var(--yellow-mark)"></i>60–69 需加強</span><span><i style="background:var(--red)"></i>&lt;60 或有檢核未達</span><span>EPA 達標＝份數、教師數、至少一位老師評分達 Level 4 皆符合</span></div></div>
  <div class="card noprint"><h2>CCC 決議匯出</h2><p class="note" style="margin:0 0 10px">在學員檔案頁填寫的決議會暫存在這台電腦的瀏覽器中。開會後請匯出 CSV（可用 Excel 開啟）保存。</p>
  <button class="btn" onclick="exportDec()">匯出決議 CSV</button></div>`;
  return h;
}

/* ---------------- 學員檔案 ---------------- */
function bar(label,v){ return `<div class="bar"><div class="lab"><span>${label}</span><b>${f1(v)}</b></div><div class="track"><div class="fill ${cls(v)}" style="width:${Math.min(100,v||0)}%"></div><div class="t60" style="left:60%"></div></div></div>` }

const LO=40, HI=100;
const pos = v => Math.max(0,Math.min(100,(v-LO)/(HI-LO)*100));
function dumbbell(name, a, b, aLab='前', bLab='後', note=''){
  if (a==null && b==null) return '';
  let dots='', seg='', d='';
  if (a!=null && b!=null){
    const l=Math.min(pos(a),pos(b)), w=Math.abs(pos(b)-pos(a));
    seg = `<div class="seg" style="left:${l}%;width:${w}%;background:${b>=a?'var(--accent)':'var(--red)'};opacity:.35"></div>`;
    const dd = b-a; d = `<span class="${dd>0?'up':dd<0?'down':''}">${dd>0?'+':''}${fmt(dd)}</span>`;
  }
  if (a!=null) dots += `<div class="dot pre" style="left:${pos(a)}%" title="${aLab}：${fmt(a)}"></div>`;
  if (b!=null) dots += `<div class="dot post" style="left:${pos(b)}%" title="${bLab}：${fmt(b)}"></div>`;
  return `<div class="db"><div class="nm">${name}${note?`<div class="note">${note}</div>`:''}</div>
    <div class="sc"><div class="ax"></div><div class="tk" style="left:${pos(60)}%"></div>${seg}${dots}</div>
    <div class="dv">${fmt(a)} → <b>${fmt(b)}</b> ${d}</div></div>`;
}
function axisHead(){
  return `<div class="db" style="padding:0"><div></div><div class="sc" style="height:14px">${[40,60,80,100].map(t=>`<span class="tl" style="left:${pos(t)}%;top:0">${t}</span>`).join('')}</div><div></div></div>`;
}

function selfAvg(f){ const v=(f?.子項||[]).map(i=>SELF_MAP[i.評分]).filter(x=>x); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null }

function subTable(id, st, kind){
  const fs = formsOf(id,st,kind);
  const pre = fs.find(f=>f.前後測==='前測'), post = [...fs].reverse().find(f=>f.前後測==='後測');
  if (!pre || !post) return '';
  const rows = pre.子項.map((it,k)=>{ const a=it.評分, b=post.子項[k]?.評分; const d=(a!=null&&b!=null)?b-a:null;
    return `<tr><td class="l">${esc(it.項目)}</td><td>${a??'—'}</td><td>${b??'—'}</td><td class="${d>0?'up':d<0?'down':''}">${d==null?'':(d>0?'+':'')+d}</td></tr>` }).join('');
  return `<details><summary>${kind} 子項前後測（${pre.評分教師||''} → ${post.評分教師||''}）</summary>
    <table class="sub-t"><thead><tr><th class="l">項目</th><th>前測</th><th>後測</th><th>變化</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

function formPass(f){
  const ov = (f.子項||[]).find(i=>/整體/.test(i.項目||'') && i.評分!=null);
  if (ov) return ov.評分 >= (DATA.規則.EPA_TARGET||4);
  const v = (f.子項||[]).map(i=>i.評分).filter(x=>x!=null);
  return v.length>0 && v.every(x=>x >= (DATA.規則.EPA_TARGET||4));
}
function lvCell(v, raw){
  if (v==null) return `<span class="lv n">${raw&&/NA/.test(raw)?'NA':'—'}</span>`;
  const c = v>=4 ? 'g' : v>=3 ? 'y' : 'r';
  const txt = raw ? raw.replace(/level\s*/i,'') : fmt(v);
  return `<span class="lv ${c}">${esc(txt)}</span>`;
}

function hl(t){
  let s = esc(t);
  WARN_WORDS.forEach(w=>{ s = s.split(w).join(`<mark class="w">${w}</mark>`) });
  SUGG_WORDS.forEach(w=>{ s = s.replace(new RegExp(`(?![^<]*>)${w}`,'g'), `<mark class="s">${w}</mark>`) });
  return s;
}
const hasSugg = t => SUGG_WORDS.some(w=>t.includes(w)) || WARN_WORDS.some(w=>t.includes(w));

function compact(d){
  d = String(d??'');
  if (d.startsWith('達標：')) d = d.slice(3).replace(/（[^）]*）/g,'');
  return d
    .replace(/(\d{4})-(\d{2})-(\d{2})/g,(m,y,mo,da)=>`${+mo}/${+da}`)
    .replace(/整體 Level\s*/g,'整體 L').replace(/最低 Level\s*/g,'最低 L').replace(/Level\s*/g,'L')
    .replace(/、(PT[A-Z0-9]{1,2})（/g,' $1（')
    .replace(/(\d{1,2}\/\d{1,2})[、 ](PT[A-Z0-9]{1,2})/g,'$2 $1');
}
function chkRow(label, ok, detail){
  const ic = ok==null ? '' : ok ? '✓' : '✗';
  return `<div class="chk ${ok===false?'bad':''}"><span class="ic ${ok?'ok':'no'}">${ic}</span><span class="lb">${esc(label)}</span><span class="d" title="${esc(detail)}">${esc(compact(detail))}</span></div>`;
}
function renderChecks(list){
  const basic = list.filter(c=>!c[0].startsWith('EPA「'));
  const epa = list.filter(c=>c[0].startsWith('EPA「'));
  let h = basic.map(c=>chkRow(c[0].replace('自評表 實習前／實習後','自評表前後測').replace('自評後測各項達 B 以上','自評後測達 B'), c[1], c[2])).join('');
  const topics = [...new Set(epa.map(c=>c[0].split('」')[0].slice(4)))];
  for (const tp of topics){
    const cs = epa.filter(c=>c[0].startsWith('EPA「'+tp+'」'));
    const lab = c => c[0].includes('位教師') ? '觀察教師' : c[0].includes('Level') ? '評分達 L4' : '份數';
    h += `<div class="epa-g"><div class="tt" title="${esc(tp)}">EPA・${esc(tp)}</div>${cs.map(c=>chkRow(lab(c), c[1], c[2])).join('')}</div>`;
  }
  return h;
}
function renderSt(){
  const r = STU[cur], id = r.學員, sts = stationsOf(r);
  let h = `<div class="stuhead"><h2>${esc(id)}</h2><span class="pill ${stCls(r.狀態)}">${r.狀態}</span><span class="note">輪訓：${sts.join('、')}${sts.filter(s=>r.站別[s].單一教師).length?`（${sts.filter(s=>r.站別[s].單一教師).map(s=>`${s}由 ${(r.站別[s].帶站教師||[]).join('、')} 帶站`).join('；')}）`:''}</span><span class="sp"></span>
    <span class="noprint"><button class="btn" onclick="openStu(${(cur+STU.length-1)%STU.length})">← 上一位</button>
    <select class="btn" onchange="openStu(+this.value)">${STU.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(x.學員)}</option>`).join('')}</select>
    <button class="btn" onclick="openStu(${(cur+1)%STU.length})">下一位 →</button>
    <button class="btn" onclick="print()">列印</button></span></div>`;

  // 判定摘要

  if (!r.未達.length && !r.建議討論.length) h += `<p style="margin:0">✓ 所有條件皆達標，沒有需要討論的事項。</p>`;

  // 檢核
  h += `<div class="card"><h2>通過條件檢核</h2><div class="grid">`;

    h += `<div class="box"><h3>${s}站 <span class="cell ${nf?'r':'g'}">${nf?`✗ ${nf} 項`:'✓ 全部達標'}</span></h3>
      ${renderChecks(x.檢核)}</div>`; });
  const o=r.整體, rep=o.報告;
  const oc = [...Object.entries(rep).map(([k,v])=>[`${k} ≥ 60`, v!=null&&v>=PASS, v==null?'無成績':fmt(v)]),
              ['跨團隊討論單', o.跨團隊討論單>0, `${o.跨團隊討論單} 份`],
              ...Object.entries(r.課程||{}).map(([s,w])=>[`${s}核心課程後測 ≥ 60`, !w.後測未過.length, w.後測未過.length?'未過：'+w.後測未過.join('、'):(w.補考通過.length?'補考通過':'全部通過')])];
  const onf = oc.filter(c=>!c[1]).length;
  h += `<div class="box"><h3>學術與課程 <span class="cell ${onf?'r':'g'}">${onf?`✗ ${onf} 項`:'✓ 全部達標'}</span></h3>
    ${oc.map(c=>chkRow(c[0].replace('核心課程後測 ≥ 60','課程後測 ≥ 60'), c[1], c[2])).join('')}
    ${chkRow('CT／JM', null, `${fmt(o['CT（個案＋專題）'])}／${fmt(o['JM（期刊）'])}`)}</div>`;
  h += `</div></div>`;

  // 站總分
  h += `<div class="card"><h2>各站成績組成<small>黑線為 60 分門檻</small></h2><div class="grid">`;
  sts.forEach(s=>{ const x=r.站別[s], c=x.分數, t=x.工具平均, w=x.筆試明細;
    h += `<div class="box"><h3>${s}站 <span class="cell ${cls(x.站總分)}">${f1(x.站總分)}</span></h3>

function cohortStats(c){
  const S = c.學員, n = S.length;
  const cnt={g:0,y:0,r:0}; S.forEach(r=>cnt[stCls(r.狀態)]++);
  const avg = a => { const v=a.filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((p,q)=>p+q,0)/v.length : null };
  const st = {}; ST_ORDER.forEach(s=>{ st[s]=avg(S.map(r=>r.站別[s]?.站總分)) });
  const pp = tool => { const pre=[], post=[];
    S.forEach(r=>ST_ORDER.forEach(s=>{ const x=r.站別[s]?.[tool+'前後測']; if(x&&x.前測!=null&&x.後測!=null){pre.push(x.前測);post.push(x.後測)} }));
    return [avg(pre), avg(post)] };
  const course = (()=>{ const pre=[],post=[]; S.forEach(r=>Object.values(r.課程||{}).forEach(w=>{ if(w.前測平均!=null)pre.push(w.前測平均); if(w.後測平均!=null)post.push(w.後測平均) })); return [avg(pre),avg(post)] })();
  let eok=0, eall=0; S.forEach(r=>{ const e=epaSummary(r); eok+=e.ok; eall+=e.all });
  return { n, cnt, st, mini:pp('Mini-CEX'), dops:pp('DOPS'), course, epa: eall? eok/eall : null,
    ct: avg(S.map(r=>r.整體['CT（個案＋專題）'])), jm: avg(S.map(r=>r.整體['JM（期刊）'])), tot: avg(S.map(r=>r.整體['總成績（參考）'])) };
}

const TCH_TOOLS = ['Mini-CEX','DOPS','CbD','臨床專業表現評核表','教學活動紀錄表','EPA','報告（指導）'];
function epaScore(f){
  const ov = (f.子項||[]).find(i=>/整體/.test(i.項目||'') && i.評分!=null);
  if (ov) return ov.評分;
  const v=(f.子項||[]).map(i=>i.評分).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function teacherRows(){
  const forms = tchScope==='本梯次' ? FORMS.map(f=>({...f,_c:DATA.梯次})) : ALL.梯次.flatMap(c=>c.表單.map(f=>({...f,_c:c.梯次})));
  const rec = [];
  forms.forEach(f=>{
    let tool=f.表單, v=f.得分, t=f.評分教師;
    if (tool==='EPA') v = epaScore(f);
    if (/報告$/.test(tool)) { tool='報告（指導）'; t=f.其他?.指導教師||t; }
    if (!TCH_TOOLS.includes(tool) || v==null || !t) return;
    rec.push({t, tool, v, stu:f.學員, st:f.站別||'學術', c:f._c, d:f.日期});
  });
  const toolMean = {}; TCH_TOOLS.forEach(k=>{ const a=rec.filter(r=>r.tool===k).map(r=>r.v); toolMean[k]=a.length? a.reduce((p,q)=>p+q,0)/a.length : null });
  const T = [...new Set(rec.map(r=>r.t))].sort((a,b)=>natKey(a)<natKey(b)?-1:1);
  return {rec, toolMean, T};
}

  <li>站總分 ≥ 60：臨床表現 55%（Mini-CEX、DOPS、CbD 各自平均後再平均）＋筆試 20%（核心課程前測平均與後測平均的平均）＋專業行為與態度 15%（學習討論單）＋行政管理與效率 10%（臨床專業表現評核表）</li>
  <li>四站核心課程後測皆 ≥ 60（未輪訓的站別也要上課）；補考通過以 60 分計；小兒以總前測／總後測計</li>
  <li>個案、專題、期刊報告各 ≥ 60；需有跨團隊討論單</li></ul>
  <h3>建議討論（條件達標，但值得委員注意）</h3>
  <ul class="reasons"><li>站總分或報告落在 60–69</li><li>Mini-CEX 或 DOPS 後測低於前測</li><li>核心課程後測補考通過</li></ul>
